name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - pokedle
      - web-beta

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web beta
        run: >-
          flutter build web
          --release
          --base-href /pokedex_codex/
          --dart-define=APP_ENV=beta
          --dart-define=APP_VERSION=${{ github.sha }}
